# Nixpacks configuration for Railway deployment with permission fix
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps --package-lock=false --registry=https://registry.npmjs.org/",
  "cd client && npm install --legacy-peer-deps --package-lock=false --registry=https://registry.npmjs.org/"
]

[phases.build]
cmds = [
  "chmod +x ./client/node_modules/.bin/react-scripts || true",
  "cd client && npm run build"
]

[start]
cmd = "npm start"
