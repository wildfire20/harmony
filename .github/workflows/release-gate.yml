name: Release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: harmony_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_test -d harmony_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      FINANCE_TEST_DATABASE_URL: postgresql://finance_test:disposable_test_only@127.0.0.1:5432/harmony_release_test
      FINANCE_TEST_DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix client --no-audit --no-fund
      - run: node --test tests/phase2-finance-operations.test.js
      - run: npm run release-gate
